version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mahasetu-postgres
    restart: always
    environment:
      POSTGRES_USER: mahasetu_user
      POSTGRES_PASSWORD: mahasetu_pass
      POSTGRES_DB: mahasetu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahasetu_user -d mahasetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mahasetu-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mahasetu-backend
    restart: always
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://mahasetu_user:mahasetu_pass@postgres:5432/mahasetu_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=mahasetu_sih_2026_super_secret_jwt_key_maharashtra_state
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mahasetu-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
